<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Zenda</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #fdfcfa;
      --ink: #1c1d21;
      --ink-muted: #5f6168;
      --line: rgba(28, 29, 33, 0.10);
      --steel: #5b6b7a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171b;
        --surface: #1e1f24;
        --ink: #ecebe6;
        --ink-muted: #a3a4aa;
        --line: rgba(236, 235, 230, 0.12);
        --steel: #8fa1b1;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.6;
    }
    header.site {
      max-width: 44rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .mark {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: .01em;
    }
    .mark .tile {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--ink); color: var(--bg);
      display: inline-grid; place-items: center;
      font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 18px;
    }
    nav.docs a {
      color: var(--ink-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-left: 1rem;
    }
    nav.docs a[aria-current="page"] { color: var(--ink); }
    main {
      max-width: 44rem;
      margin: 1.5rem auto 4rem;
      padding: 2.25rem 1.5rem;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -20px rgba(0,0,0,.25);
    }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 .5rem; letter-spacing: -.01em; }
    h1 + p strong { color: var(--ink-muted); font-weight: 500; }
    h2 { font-size: 1.25rem; margin: 2.25rem 0 .6rem; letter-spacing: -.005em; }
    h3 { font-size: 1.05rem; margin: 1.5rem 0 .4rem; }
    p, li { color: var(--ink); }
    a { color: var(--steel); }
    strong { font-weight: 600; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
    .table-wrap { overflow-x: auto; margin: 1rem 0; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; }
    th, td { text-align: left; vertical-align: top; padding: .55rem .6rem; border-bottom: 1px solid var(--line); }
    th { font-weight: 600; color: var(--ink-muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
    blockquote { margin: 1rem 0; padding: .25rem 1rem; border-left: 3px solid var(--steel); color: var(--ink-muted); }
    code { font-size: .92em; background: var(--bg); padding: .1em .35em; border-radius: 5px; }
    footer.site {
      max-width: 44rem; margin: 0 auto; padding: 0 1.25rem 3rem;
      color: var(--ink-muted); font-size: 13px;
    }
    footer.site p { margin: .25rem 0; }
    .coach { font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 500; }
    @media (max-width: 600px) {
      body { font-size: 16px; }
      main { padding: 1.5rem 1.1rem; border-radius: 16px; margin-top: 1rem; }
      header.site { flex-direction: column; align-items: flex-start; }
      nav.docs a { margin-left: 0; margin-right: 1rem; }
    }
  </style>
</head>
<body>
  <header class="site">
    <a class="mark" href="{{ '/' | relative_url }}"><span class="tile">Z</span> Zenda</a>
    <nav class="docs" aria-label="Legal documents">
      <a href="{{ '/privacy-policy/' | relative_url }}" {% if page.url == '/privacy-policy/' %}aria-current="page"{% endif %}>Privacy</a>
      <a href="{{ '/terms-of-service/' | relative_url }}" {% if page.url == '/terms-of-service/' %}aria-current="page"{% endif %}>Terms</a>
      <a href="{{ '/health-disclaimer/' | relative_url }}" {% if page.url == '/health-disclaimer/' %}aria-current="page"{% endif %}>Health</a>
    </nav>
  </header>
  <main>
    {{ content | replace: '<table>', '<div class="table-wrap"><table>' | replace: '</table>', '</table></div>' }}
  </main>
  <footer class="site">
    <p><span class="coach">Zenda</span> is operated by Tauro Labs · <a href="mailto:taurolabs@gmail.com">taurolabs@gmail.com</a></p>
    <p>These pages are generated from the canonical documents in the Zenda repository. The in-app copies are identical.</p>
  </footer>
</body>
</html>
